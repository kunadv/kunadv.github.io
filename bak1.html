
<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <title>Komputery</title>
    <link rel="stylesheet" href="styl.css">
    <link rel="icon" href="favicon.png">
    <script>
        function wyslijFormularz() {
            let imie = document.getElementById('imie').value;
            let nazwisko = document.getElementById('nazwisko').value;
            let email = document.getElementById('email').value.toLowerCase();
            let usluga = document.getElementById('usluga').value;
            
            let wynikDiv = document.getElementById('wynik');
            wynikDiv.innerHTML = imie + ' ' + nazwisko + '<br>' + email + '<br>Usługa: ' + usluga;
        }
    </script>
</head>
<body>
    <div id="kontener">
        <header>
            <img src="animacja.gif" alt="Pogotowie komputerowe">
        </header>
        <nav>
            <a href="index.html">Strona Główna</a>
            <a href="kontakt.html">Kontakt</a>
        </nav>
        <main>
            <section></section>
            <section>
                <h2>Kontakt</h2>
                <table>
                    <tr>
                        <td>Imię:</td>
                        <td><input type="text" id="imie"></td>
                    </tr>
                    <tr>
                        <td>Nazwisko:</td>
                        <td><input type="text" id="nazwisko"></td>
                    </tr>
                    <tr>
                        <td>E-mail:</td>
                        <td><input type="email" id="email"></td>
                    </tr>
                    <tr>
                        <td>Zgłoszenie:</td>
                        <td>
                            <select id="usluga">
                                <option value="naprawa komputerów">naprawa komputerów</option>
                                <option value="odzyskiwanie danych">odzyskiwanie danych</option>
                                <option value="wirusy">wirusy</option>
                                <option value="konfiguracja LAN">konfiguracja LAN</option>
                            </select>
                        </td>
                    </tr>
                    <tr>
                        <td></td>
                        <td><input type="checkbox" id="kopia" checked> Wyślij kopię wiadomości</td>
                    </tr>
                    <tr>
                        <td></td>
                        <td>
                            <button type="reset">Czyść</button>
                            <button type="button" onclick="wyslijFormularz()">Wyślij</button>
                        </td>
                    </tr>
                </table>
                <hr>
                <p id="wynik"></p>
            </section>
            <section></section>
        </main>
        <footer>
            Autor: <i>00000000000</i>
        </footer>
    </div>
</body>
</html>
