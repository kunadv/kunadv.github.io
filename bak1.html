
<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <title>Biuro turystyczne</title>
    <link rel="stylesheet" href="styl.css">
</head>
<body>

    <header>
        <h1>Zwiedzamy Polskę</h1>
    </header>

    <section class="lewy">
        <button onclick="poprzednieZdjecie()">&lt;</button>
    </section>

    <section class="srodkowy">
        <img id="aktywneZdjecie" src="1.jpg" alt="Aktywne zdjęcie">
    </section>

    <section class="prawy">
        <button onclick="nastepneZdjecie()">&gt;</button>
    </section>

    <section class="miniatury">
        <img src="1.jpg" alt="Gdańsk" onclick="zmienZdjecie(1)">
        <img src="2.jpg" alt="Kraków" onclick="zmienZdjecie(2)">
        <img src="3.jpg" alt="Niedzica" onclick="zmienZdjecie(3)">
        <img src="4.jpg" alt="Pieniny" onclick="zmienZdjecie(4)">
        <img src="5.jpg" alt="Szklarska Poręba" onclick="zmienZdjecie(5)">
        <img src="6.jpg" alt="Tatry" onclick="zmienZdjecie(6)">
        <img src="7.jpg" alt="Wrocław" onclick="zmienZdjecie(7)">
    </section>

    <footer>
        <h3>Autorem galerii jest:</h3>
        <p>00000000000</p> <!-- Zastąp swoim numerem zdającego -->
        <p><a href="http://pixabay.com" target="_blank">Więcej zdjęć</a></p>
    </footer>

    <script>
        // Zmienna przechowująca numer aktualnie wyświetlanego zdjęcia (od 1 do 7)
        let numerAktualnegoZdjecia = 1;

        function nastepneZdjecie() {
            numerAktualnegoZdjecia++;
            if (numerAktualnegoZdjecia > 7) {
                numerAktualnegoZdjecia = 1;
            }
            document.getElementById('aktywneZdjecie').src = numerAktualnegoZdjecia + '.jpg';
        }

        function poprzednieZdjecie() {
            numerAktualnegoZdjecia--;
            if (numerAktualnegoZdjecia < 1) {
                numerAktualnegoZdjecia = 7;
            }
            document.getElementById('aktywneZdjecie').src = numerAktualnegoZdjecia + '.jpg';
        }

        function zmienZdjecie(numer) {
            numerAktualnegoZdjecia = numer;
            document.getElementById('aktywneZdjecie').src = numerAktualnegoZdjecia + '.jpg';
        }
    </script>

</body>
</html>
